═══════════════════════════════════════════════════════════════
ВАЖНО! Как правильно менять пути:
═══════════════════════════════════════════════════════════════

1. Если хотите изменить БАЗОВЫЙ ПУТЬ КО ВСЕМ ФАЙЛАМ:
   → Измените только assetsPath
   → Все остальные пути перестроятся автоматически!

2. Если хотите заменить КОНКРЕТНЫЙ файл на свой:
   → Укажите ПОЛНЫЙ путь к вашему файлу в media.ИМЯ_ФАЙЛА
   → Не дублируйте assetsPath в каждом пути!

═══════════════════════════════════════════════════════════════
-->

</script>
